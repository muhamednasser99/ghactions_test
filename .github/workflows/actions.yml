on:
  workflow_dispatch:

jobs:
  hybrid_job:
    runs-on: ubuntu-latest
    steps:
      - name: Run a command in Ubuntu VM
        run: echo "This runs on the Ubuntu VM"

      - name: Run inside an Alpine Container 
        uses: docker://alpine:3.14    # must be a public docker image
        with:
          entrypoint: /bin/sh
          args: |
            -c "echo 'This step runs inside an Alpine container'"

      - name: Run another command in Ubuntu VM
        run: echo "Back to the VM"

  dockerized_job:
    runs-on: ubuntu-latest
    container: 
        image: ghcr.io/my-org/my-private-image:latest    # private image
        credentials:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - run: node --version
      - run: echo "This whole job runs inside a NodeJS Container"